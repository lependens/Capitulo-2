name: oficial-forecast

# Captura de las previsiones oficiales: ET0 prevista de SIAR (suministrada por AEMET) y prevision
# municipal diaria de AEMET OpenData. La serie "tal como se emitio" no se puede reconstruir despues.
# Tres capturas al dia, aprobadas por Josep el 27-11-2026: 08:00, 14:00 y 20:00 en horario de invierno
# (el cron va en UTC; en verano son las 09:00, 15:00 y 21:00). Estados en data/forecast_oficial/estado.csv.
# El workflow solo falla (y GitHub avisa por correo) con errores reales; SIAR sin prevision no falla.
# La clave de AEMET va en el secret AEMET_API_KEY del repo; nunca en un fichero.

on:
  schedule:
    - cron: "7 7,13,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "prueba (IB04 + Palma, con exploracion) o completo (todas las estaciones configuradas)"
        default: completo
        type: choice
        options: [prueba, completo]

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: IP de salida (para saber desde donde llama la prueba)
        run: curl -s --max-time 10 https://api.ipify.org || true
      - name: Capturar
        env:
          PYTHONPATH: src
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python tools/capture_oficial.py --mode "${{ github.event.inputs.mode || 'completo' }}"
      - name: Guardar datos en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/raw
          [ -d data/forecast_oficial ] && git add -A data/forecast_oficial
          if ! git diff --cached --quiet; then
            git commit -m "data: captura oficial SIAR/AEMET $(date -u +%F-%H%M)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
